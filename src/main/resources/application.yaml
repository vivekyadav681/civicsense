spring:
  application:
    name: civicsense

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

# ── Application-specific configuration ──────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}

  # ── Storage Configuration ──
  storage:
    use-local: ${USE_LOCAL_STORAGE}
    local-upload-dir: ${LOCAL_UPLOAD_DIR}
    s3:
      bucket-name: ${S3_BUCKET}
      region: ${AWS_REGION}
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
      base-url: ${S3_BASE_URL}

  # ── Deduplication radius in metres ──
  deduplication:
    radius-metres: ${DEDUPLICATION_RADIUS_METRES}

  # ── Department names ──
  departments:
    waste: ${DEPT_WASTE}
    roads: ${DEPT_ROADS}
    streetlights: ${DEPT_STREETLIGHTS}
    other: ${DEPT_OTHER}

server:
  port: ${SERVER_PORT}

logging:
  level:
    com.example.civicsense: ${LOG_LEVEL}
    org.springframework.security: INFO
