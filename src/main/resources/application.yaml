spring:
  application:
    name: civicsense

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:civicsense_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:15MB}

# ── Application-specific configuration ──────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

  # ── S3 Storage (set USE_LOCAL_STORAGE=true for dev/testing) ──
  storage:
    use-local: ${USE_LOCAL_STORAGE:true}
    local-upload-dir: ${LOCAL_UPLOAD_DIR:./uploads}
    s3:
      bucket-name: ${S3_BUCKET:civicsense-images}
      region: ${AWS_REGION:ap-south-1}
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
      base-url: ${S3_BASE_URL:https://${S3_BUCKET:civicsense-images}.s3.${AWS_REGION:ap-south-1}.amazonaws.com}

  # ── Deduplication radius in metres ──
  deduplication:
    radius-metres: ${DEDUPLICATION_RADIUS_METRES:50}

  # ── Department name seeds (must match data.sql inserts) ──
  departments:
    waste: ${DEPT_WASTE:Sanitation}
    roads: ${DEPT_ROADS:Public Works}
    streetlights: ${DEPT_STREETLIGHTS:Electrical}
    other: ${DEPT_OTHER:General Administration}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.example.civicsense: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
